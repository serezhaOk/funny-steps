<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>FUNNY STEPS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◼</text></svg>" />
  </head>
  <body>
    <div id="boot">
      <div class="boot-grid" aria-hidden="true"></div>
      <button id="boot-btn">TAP TO START</button>
      <pre id="boot-err" hidden></pre>
    </div>

    <div id="app" hidden>
      <header>
        <button id="bpm" class="lbl">120 BPM</button>
        <button id="view-toggle" aria-label="tracks">
          <span></span><span></span><span></span><span></span>
        </button>
        <div class="key">
          <button id="root" class="lbl">A</button>
          <button id="scale" class="lbl">MINOR</button>
        </div>
      </header>
      <div id="stage">
        <canvas id="grid"></canvas>
        <div id="mixer-ui"></div>
      </div>
      <footer>
        <button id="erase" class="lbl">ERASE</button>
        <button id="sample" class="lbl">KALIMBOX</button>
        <button id="rndm" class="lbl">RNDM</button>
      </footer>
      <div class="home" aria-hidden="true"></div>
    </div>

    <div id="auth" hidden>
      <div class="auth-scrim"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Create your account">
        <div class="grabber"></div>
        <button id="auth-close" class="auth-close" aria-label="Close">✕</button>
        <h2>Create your account</h2>
        <p class="auth-sub">
          Save your projects and get access to new presets and sounds
        </p>
        <button id="auth-google" class="auth-google">
          <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.400 2.6 13.2l7.8 6.1C12.3 13.1 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.2 5.4-4.7 7l7.6 5.9c4.4-4.1 6.8-10.1 6.8-17.4z"/>
            <path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C1 16.3 0 20 0 24s1 7.7 2.6 10.8l7.8-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.3 0-11.7-3.6-13.6-8.9l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
        <div class="auth-or"><span>or enter email</span></div>
        <form id="auth-email-form" novalidate>
          <input
            id="auth-email"
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="example@email.com"
          />
        </form>
        <p id="auth-msg" class="auth-msg" hidden></p>
        <p class="auth-terms">
          By continuing, you agree to our <a href="#" id="auth-terms">Terms</a>
          and <a href="#" id="auth-privacy">Privacy Policy</a>.
        </p>
      </div>
    </div>

    <script>
      // Surface any startup error on screen (mobile has no console).
      window.__bootErr = function (m) {
        var e = document.getElementById('boot-err');
        if (e) { e.textContent = String(m); e.hidden = false; }
      };
      window.addEventListener('error', function (ev) {
        window.__bootErr((ev.error && ev.error.stack) || ev.message);
      });
      window.addEventListener('unhandledrejection', function (ev) {
        var r = ev.reason;
        window.__bootErr('promise: ' + ((r && (r.stack || r.message)) || r));
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
