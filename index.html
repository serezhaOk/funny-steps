<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>SQIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- display=block so a slow font never flashes the raw ligature text -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◼</text></svg>" />
  </head>
  <body>
    <div id="landing">
      <div class="landing-inner">
        <svg class="logo" viewBox="0 0 120 120" aria-hidden="true">
          <rect x="1" y="1" width="118" height="118" rx="26"
                fill="none" stroke="#4a4a4a" stroke-width="2" />
          <g fill="#d9d9d9">
            <circle cx="30" cy="32" r="7" />
            <circle cx="53" cy="32" r="7" />
            <circle cx="75" cy="32" r="3" />
            <circle cx="96" cy="32" r="7" />
            <circle cx="32" cy="56" r="4" />
            <circle cx="54" cy="56" r="4" />
            <circle cx="75" cy="56" r="2.4" fill="#8a8a8a" />
            <circle cx="94" cy="56" r="2.4" fill="#8a8a8a" />
            <circle cx="34" cy="76" r="2.4" fill="#7a7a7a" />
            <circle cx="55" cy="76" r="2.4" fill="#7a7a7a" />
            <circle cx="75" cy="76" r="2.4" fill="#6d6d6d" />
            <circle cx="92" cy="76" r="2.4" fill="#6d6d6d" />
            <circle cx="36" cy="93" r="1.8" fill="#5c5c5c" />
            <circle cx="56" cy="93" r="1.8" fill="#5c5c5c" />
            <circle cx="75" cy="93" r="1.8" fill="#5c5c5c" />
            <circle cx="90" cy="93" r="1.8" fill="#5c5c5c" />
          </g>
        </svg>
        <h1 class="wordmark">SQIA</h1>
        <p class="tagline">Built for sound accidents</p>

        <div id="signed-out">
          <button id="google-btn" class="btn-light">
            <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.1 17.7 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.2 5.4-4.7 7l7.6 5.9c4.4-4.1 6.8-10.1 6.8-17.4z"/>
              <path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C1 16.3 0 20 0 24s1 7.7 2.6 10.8l7.8-6.1z"/>
              <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.3 0-11.7-3.6-13.6-8.9l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
            </svg>
            <span>Continue with Google</span>
          </button>

          <button id="email-btn" class="btn-dark">Continue with email</button>

          <form id="email-form" hidden novalidate>
            <input id="email-input" type="email" inputmode="email"
                   autocomplete="email" placeholder="example@email.com" />
            <button type="submit" class="btn-light" id="email-send">
              Send sign-in link
            </button>
          </form>

          <p class="terms">
            By continuing, you agree to our <a href="#" id="terms">Terms</a>
            and <a href="#" id="privacy">Privacy Policy</a>.
          </p>
        </div>

        <div id="signed-in" hidden>
          <button id="enter-btn" class="btn-light">Enter</button>
          <p class="who"><span id="who-email"></span> · <button id="signout">sign out</button></p>
        </div>

        <p id="landing-msg" class="landing-msg" hidden></p>

        <a
          id="about-btn"
          class="about"
          href="https://www.instagram.com/reel/Dbh7eVJAed7/?igsh=MTJ2MzQxaGZtNm81dw=="
          target="_blank"
          rel="noopener noreferrer"
          >What is SQIA?</a
        >
      </div>
      <pre id="boot-err" hidden></pre>
    </div>


    <div id="projects" hidden>
      <header class="p-head">
        <span class="p-logo" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </span>
        <button id="profile-btn" class="p-profile" aria-label="Account">
          <span class="material-symbols-outlined">emoticon</span>
        </button>
      </header>
      <h1 class="p-title">Projects</h1>
      <div id="p-list"></div>
      <button id="create-new" class="p-create" hidden>+ Create new</button>
      <div id="p-menu" class="p-menu" hidden>
        <button data-act="rename">Rename</button>
        <button data-act="delete" class="danger">Delete</button>
      </div>
      <div id="p-account" class="p-menu p-account" hidden>
        <span id="p-account-email"></span>
        <button data-act="signout">Log out</button>
      </div>
    </div>

    <div id="app" hidden>
      <header>
        <button id="bpm" class="lbl">120 BPM</button>
        <button id="view-toggle" aria-label="tracks">
          <span></span><span></span>
        </button>
        <div class="key">
          <button id="root" class="lbl">A</button>
          <button id="scale" class="lbl">MINOR</button>
        </div>
      </header>
      <div id="stage">
        <canvas id="grid"></canvas>
        <div id="mixer-ui"></div>
      </div>
      <footer>
        <button id="erase" class="lbl">ERASE</button>
        <button id="sample" class="lbl">KALIMBOX</button>
        <button id="rndm" class="lbl">RNDM</button>
      </footer>
      <div class="home" aria-hidden="true"></div>
    </div>

    <script>
      // Surface any startup error on screen (mobile has no console).
      window.__bootErr = function (m) {
        var e = document.getElementById('boot-err');
        if (e) { e.textContent = String(m); e.hidden = false; }
      };
      window.addEventListener('error', function (ev) {
        window.__bootErr((ev.error && ev.error.stack) || ev.message);
      });
      window.addEventListener('unhandledrejection', function (ev) {
        var r = ev.reason;
        window.__bootErr('promise: ' + ((r && (r.stack || r.message)) || r));
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
